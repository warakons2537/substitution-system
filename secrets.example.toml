# คัดลอกตัวอย่างนี้ไปวางใน Streamlit Community Cloud → App settings → Secrets
# ห้าม commit ไฟล์ secrets.toml จริงขึ้น GitHub

FREECLOUD_MODE = "1"

# Supabase: Project → Connect → Session pooler → URI
# ใช้ Session pooler (port 5432) สำหรับ Streamlit Community Cloud
DATABASE_URL = "postgresql://postgres.PROJECT_REF:YOUR_DATABASE_PASSWORD@POOLER_HOST:5432/postgres?sslmode=require"

# สร้าง Admin ครั้งแรกเท่านั้น
BOOTSTRAP_ADMIN_USERNAME = "admin"
BOOTSTRAP_ADMIN_PASSWORD = "CHANGE_TO_A_LONG_RANDOM_PASSWORD"
BOOTSTRAP_ADMIN_NAME = "ผู้ดูแลระบบ"
SEED_SAMPLE_DATA = "0"

# --- Supabase Storage (ใส่ภายหลังก็ได้) ---
# สร้าง bucket ก่อน เช่น substitution-documents
# จาก Supabase Storage → S3 → Access keys / endpoint / region
# S3_BUCKET = "substitution-documents"
# S3_ENDPOINT_URL = "https://PROJECT_REF.storage.supabase.co/storage/v1/s3"
# S3_REGION = "YOUR_PROJECT_REGION"
# S3_ACCESS_KEY_ID = "YOUR_S3_ACCESS_KEY_ID"
# S3_SECRET_ACCESS_KEY = "YOUR_S3_SECRET_ACCESS_KEY"
